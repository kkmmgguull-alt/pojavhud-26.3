name: Build PojavHUD 1.3.0 (26.3)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-26_3:
    name: Build 26.3
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.7.1'

    - name: Generate Config & Logo
      run: |
        mkdir -p src/main/java/com/pojavhud src/main/java/com/terraformersmc/modmenu/api src/main/resources/assets/pojavhud/lang
        printf 'pluginManagement {\n  repositories {\n    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\nrootProject.name = "pojavhud"\n' > settings.gradle
        printf 'org.gradle.jvmargs=-Xmx3G\norg.gradle.parallel=true\norg.gradle.configuration-cache=false\nminecraft_version=26.3\nloader_version=0.19.5\nloom_version=1.18-SNAPSHOT\nversion=1.3.0\ngroup=com.pojavhud\narchives_base_name=pojavhud-26.3\nfabric_api_version=0.163.0+26.3\n' > gradle.properties
        printf 'plugins {\n  id "net.fabricmc.fabric-loom" version "${loom_version}"\n  id "maven-publish"\n}\nversion = project.version\ngroup = project.group\nbase { archivesName = project.archives_base_name }\nrepositories { maven { url = "https://maven.fabricmc.net/" }; mavenCentral() }\ndependencies {\n  minecraft "com.mojang:minecraft:${project.minecraft_version}"\n  implementation "net.fabricmc:fabric-loader:${project.loader_version}"\n  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n}\nprocessResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }\ntasks.withType(JavaCompile).configureEach { it.options.release = 25 }\njava { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }\njar { exclude("com/terraformersmc/**"); from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }\n' > build.gradle
    - name: Generate Metadata & Logo PNG
      run: |
        echo "MIT License - Copyright (c) 2025-2026 PojavHUD" > LICENSE
        printf '{"schemaVersion":1,"id":"pojavhud","version":"${version}","name":"PojavHUD (26.3)","description":"Customizable Minecraft item texture overlay for hotbar slots with multi-profile layouts. For Minecraft 26.3.","authors":["PojavHUD"],"license":"MIT","icon":"assets/pojavhud/icon.png","environment":"client","entrypoints":{"client":["com.pojavhud.PojavHudClient"],"modmenu":["com.pojavhud.ModMenuIntegration"]},"depends":{"fabricloader":">=0.19.0","minecraft":">=26.3","java":">=25","fabric-api":"*"},"suggests":{"modmenu":"*"}}\n' > src/main/resources/fabric.mod.json
        printf '{"key.pojavhud.toggle":"Toggle PojavHUD","key.pojavhud.editor":"Open PojavHUD Editor","key.pojavhud.hidemenus":"Toggle PojavHUD Hide in Menus","category.pojavhud":"PojavHUD","key.category.pojavhud.main":"PojavHUD"}\n' > src/main/resources/assets/pojavhud/lang/en_us.json
        python3 -c 'import zlib,struct;W=H=128;BG=(212,181,152,255);OL=(122,68,28,255);BD=(204,165,127,255);WH=(242,239,235,255);BB=(72,84,148,255);BL=(176,172,212,255);PL=(178,182,108,255);PB=(118,122,62,255);CK=(228,126,146,255);BT=(240,224,198,255);BK=(216,112,54,255);BW=(66,146,116,255);DW=(46,108,84,255);px=[[BG]*W for _ in range(H)];sp=lambda x,y,c:px[y].__setitem__(x,c) if 0<=x<W and 0<=y<H else 0;el=lambda cx,cy,rx,ry,c:[sp(x,y,c) for y in range(int(cy-ry-1),int(cy+ry+2)) for x in range(int(cx-rx-1),int(cx+rx+2)) if ((x-cx)/rx)**2+((y-cy)/ry)**2<=1];rc=lambda x0,y0,x1,y1,c:[sp(x,y,c) for y in range(y0,y1) for x in range(x0,x1)];[sp(x,y,OL if (x-94)*.6+abs(y-36)>=7 else BB) for y in range(28,44) for x in range(88,108) if (x-94)*.6+abs(y-36)<10];el(62,72,46,42,OL);el(62,72,43,39,BD);[sp(x,y,WH) for y in range(74,112) for x in range(18,106) if ((x-62)/42)**2+((y-72)/38)**2<=1 and y>86+abs(x-62)*.12];el(46,66,18,17,OL);el(74,66,18,17,OL);el(46,66,15.5,14.5,WH);el(74,66,15.5,14.5,WH);[sp(x,y,OL if y in(38,39,52,53) else(BL if 44<=y<=47 else BB)) for y in range(38,54) for x in range(20,102) if ((x-62)/43)**2+((y-72)/39)**2<=1.02];rc(36,37,78,55,OL);rc(38,39,76,53,PB);rc(40,41,74,51,PL);rc(42,45,44,47,OL);rc(70,45,72,47,OL);[sp(x,y,OL) for x,y in[(57,46),(58,46),(58,45),(57,44),(56,44),(55,45),(55,47),(56,48),(58,48),(59,47),(59,44),(57,43),(54,44),(53,46),(54,48),(53,48),(52,49),(60,46),(61,46)]];rc(34,64,46,67,OL);rc(72,64,84,67,OL);el(40,73,5.5,3,CK);el(78,73,5.5,3,CK);[sp(x,y,OL if abs(x-60)>max(0,(82-y)*.45) else(BT if y<72 else BK)) for y in range(66,82) for x in range(int(60-max(0,(82-y)*.45)-2),int(60+max(0,(82-y)*.45)+3)) if abs(x-60)<=max(0,(82-y)*.45)+1.5];el(48,94,13,7,OL);el(72,94,13,7,OL);el(48,94,10.5,4.8,BW);el(72,94,10.5,4.8,BW);el(60,94,5,4,DW);raw=b"".join(b"\x00"+b"".join(bytes(c) for c in r) for r in px);ch=lambda t,d:struct.pack("!I",len(d))+t+d+struct.pack("!I",zlib.crc32(t+d)&0xffffffff);open("src/main/resources/assets/pojavhud/icon.png","wb