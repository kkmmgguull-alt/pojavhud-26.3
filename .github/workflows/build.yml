    - name: Generate Client & Config Java
      run: |
        cat << 'EOF' > src/main/java/com/terraformersmc/modmenu/api/ConfigScreenFactory.java
        package com.terraformersmc.modmenu.api;
        import net.minecraft.client.gui.screens.Screen;
