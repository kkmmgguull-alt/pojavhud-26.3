name: Build PojavHUD 1.3.0 (26.3)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-26_3:
    name: Build 26.3
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.7.1'

    - name: Generate Source Files & Build 26.3 Jar
      run: |
        mkdir -p src/main/java/com/pojavhud
        mkdir -p src/main/java/com/terraformersmc/modmenu/api
        mkdir -p src/main/resources/assets/pojavhud/lang

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                maven {
                    name = "Fabric"
                    url = "https://maven.fabricmc.net/"
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        rootProject.name = "pojavhud"
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx3G
        org.gradle.parallel=true
        org.gradle.configuration-cache=false

        minecraft_version=26.3
        loader_version=0.19.5
        loom_version=1.18-SNAPSHOT

        version=1.3.0
        group=com.pojavhud
        archives_base_name=pojavhud-26.3

        fabric_api_version=0.163.0+26.3
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id "net.fabricmc.fabric-loom" version "${loom_version}"
            id "maven-publish"
        }

        version = project.version
        group = project.group

        base {
            archivesName = project.archives_base_name
        }

        repositories {
            maven { url = "https://maven.fabricmc.net/" }
            mavenCentral()
        }

        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        }

        processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") {
                expand "version": project.version
            }
        }

        tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
        }

        java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
        }

        jar {
            exclude("com/terraformersmc/**")
            from("LICENSE") {
                rename { "${it}_${project.base.archivesName.get()}" }
            }
        }
        EOF

        cat << 'EOF' > LICENSE
        MIT License

        Copyright (c) 2025-2026 PojavHUD

        Permission is hereby granted, free of charge, to any person obtaining a copy
        of this software and associated documentation files (the "Software"), to deal
        in the Software without restriction, including without limitation the rights
        to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
        copies of the Software, and to permit persons to whom the Software is
        furnished to do so, subject to the following conditions:

        The above copyright notice and this permission notice shall be included in all
        copies or substantial portions of the Software.
        EOF

        cat << 'EOF' > src/main/resources/fabric.mod.json
        {
          "schemaVersion": 1,
          "id": "pojavhud",
          "version": "${version}",
          "name": "PojavHUD (26.3)",
          "description": "Customizable Minecraft item texture overlay for hotbar slots with multi-profile layouts. For Minecraft 26.3. Designed for PojavLauncher touchscreen buttons.",
          "authors": ["PojavHUD"],
          "contact": {},
          "license": "MIT",
          "icon": "assets/pojavhud/icon.png",
          "environment": "client",
          "entrypoints": {
            "client": ["com.pojavhud.PojavHudClient"],
            "modmenu": ["com.pojavhud.ModMenuIntegration"]
          },
          "depends": {
            "fabricloader": ">=0.19.0",
            "minecraft": ">=26.3",
            "java": ">=25",
            "fabric-api": "*"
          },
          "suggests": {
            "modmenu": "*"
          }
        }
        EOF

        cat << 'EOF' > src/main/resources/assets/pojavhud/lang/en_us.json
        {
          "key.pojavhud.toggle": "Toggle PojavHUD",
          "key.pojavhud.editor": "Open PojavHUD Editor",
          "key.pojavhud.hidemenus": "Toggle PojavHUD Hide in Menus",
          "category.pojavhud": "PojavHUD",
          "key.category.pojavhud.main": "PojavHUD"
        }
        EOF

        # Generate Custom Rowlet Shinobi Mod Logo (128x128 PNG)
        python3 -c '
        import zlib, struct

        W, H = 128, 128
        BG = (212, 181, 152, 255)
        OUTLINE = (122, 68, 28, 255)
        BODY = (204, 165, 127, 255)
        WHITE = (242, 239, 235, 255)
        BAND_BLUE = (72, 84, 148, 255)
        BAND_LIGHT = (176, 172, 212, 255)
        PLATE = (178, 182, 108, 255)
        PLATE_BORDER = (118, 122, 62, 255)
        CHEEK = (228, 126, 146, 255)
        BEAK_TOP = (240, 224, 198, 255)
        BEAK_BOT = (216, 112, 54, 255)
        BOW = (66, 146, 116, 255)
        BOW_DARK = (46, 108, 84, 255)

        pixels = [[BG for _ in range(W)] for _ in range(H)]

        def set_px(x, y, c):
            if 0 <= x < W and 0 <= y < H:
                pixels[y][x] = c

        def fill_ellipse(cx, cy, rx, ry, c):
            for y in range(int(cy - ry - 1), int(cy + ry + 2)):
                for x in range(int(cx - rx - 1), int(cx + rx + 2)):
                    dx = (x - cx) / rx
                    dy = (y - cy) / ry
                    if dx*dx + dy*dy <= 1.0:
                        set_px(x, y, c)

        def fill_rect(x0, y0, x1, y1, c):
            for y in range(int(y0), int(y1)):
                for x in range(int(x0), int(x1)):
                    set_px(x, y, c)

        # Headband tail
        for y in range(28, 44):
            for x in range(88, 108):
                if (x - 94)*0.6 + abs(y - 36) < 10:
                    set_px(x, y, OUTLINE)
                if (x - 94)*0.6 + abs(y - 36) < 7:
                    set_px(x, y, BAND_BLUE)

        # Main owl body
        fill_ellipse(62, 72, 46, 42, OUTLINE)
        fill_ellipse(62, 72, 43, 39, BODY)

        # White belly
        for y in range(74, 112):
            for x in range(18, 106):
                dx = (x - 62) / 42.0
                dy = (y - 72) / 38.0
                if dx*dx + dy*dy <= 1.0 and y > 86 + abs(x - 62)*0.12:
                    set_px(x, y, WHITE)

        # White face mask
        fill_ellipse(46, 66, 18, 17, OUTLINE)
        fill_ellipse(74, 66, 18, 17, OUTLINE)
        fill_ellipse(46, 66, 15.5, 14.5, WHITE)
        fill_ellipse(74, 66, 15.5, 14.5, WHITE)

        # Headband
        for y in range(38, 54):
            for x in range(20, 102):
                dx = (x - 62) / 43.0
                dy = (y - 72) / 39.0
                if dx*dx + dy*dy <= 1.02:
                    c = BAND_BLUE
                    if y in (38, 39, 52, 53): c = OUTLINE
                    elif 44 <= y <= 47: c = BAND_LIGHT
                    set_px(x, y, c)

        # Leaf village metal plate
        fill_rect(36, 37, 78, 55, OUTLINE)
        fill_rect(38, 39, 76, 53, PLATE_BORDER)
        fill_rect(40, 41, 74, 51, PLATE)
        # Rivets
        fill_rect(42, 45, 44, 47, OUTLINE)
        fill_rect(70, 45, 72, 47, OUTLINE)
        # Leaf swirl
        for px, py in [(57,46),(58,46),(58,45),(57,44),(56,44),(55,45),(55,47),(56,48),(58,48),(59,47),(59,44),(57,43),(54,44),(53,46),(54,48),(53,48),(52,49),(60,46),(61,46)]:
            set_px(px, py, OUTLINE)

        # Closed sleepy eyes
        fill_rect(34, 64, 46, 67, OUTLINE)
        fill_rect(72, 64, 84, 67, OUTLINE)

        # Blush cheeks
        fill_ellipse(40, 73, 5.5, 3, CHEEK)
        fill_ellipse(78, 73, 5.5, 3, CHEEK)

        # Beak
        for y in range(66, 82):
            hw = max(0, (82 - y) * 0.45)
            for x in range(int(60 - hw - 2), int(60 + hw + 3)):
                dist = abs(x - 60)
                if dist <= hw + 1.5:
                    set_px(x, y, OUTLINE)
                if dist <= hw:
                    set_px(x, y, BEAK_TOP if y < 72 else BEAK_BOT)

        # Leaf bowtie
        fill_ellipse(48, 94, 13, 7, OUTLINE)
        fill_ellipse(72, 94, 13, 7, OUTLINE)
        fill_ellipse(48, 94, 10.5, 4.8, BOW)
        fill_ellipse(72, 94, 10.5, 4.8, BOW)
        fill_ellipse(60, 94, 5, 4, BOW_DARK)

        # Encode PNG
        raw = b"".join(b"\x00" + b"".join(bytes(px) for px in row) for row in pixels)
        def chunk(tag, data):
            return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)

        png = b"\x89PNG\r\n\x1a\n"
        png += chunk(b"IHDR", struct.pack("!IIBBBBB", W, H, 8, 6, 0, 0, 0))
        png += chunk(b"IDAT", zlib.compress(raw))
        png += chunk(b"IEND", b"")

        with open("src/main/resources/assets/pojavhud/icon.png", "wb") as f:
            f.write(png)
        '

        cat << 'EOF' > src/main/java/com/terraformersmc/modmenu/api/ConfigScreenFactory.java
        package com.terraformersmc.modmenu.api;

        import net.minecraft.client.gui.screens.Screen;

        @FunctionalInterface
        public interface ConfigScreenFactory<S extends Screen> {
            S create(Screen parent);
        }
        EOF

        cat << 'EOF' > src/main/java/com/terraformersmc/modmenu/api/ModMenuApi.java
        package com.terraformersmc.modmenu.api;

        public interface ModMenuApi {
            default ConfigScreenFactory<?> getModConfigScreenFactory() {
                return screen -> null;
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/pojavhud/PojavHud.java
        package com.pojavhud;

        import net.fabricmc.api.ModInitializer;

        public class PojavHud implements ModInitializer {
            @Override
            public void onInitialize() {
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/pojavhud/ModMenuIntegration.java
        package com.pojavhud;

        import com.terraformersmc.modmenu.api.ConfigScreenFactory;
        import com.terraformersmc.modmenu.api.ModMenuApi;

        public class ModMenuIntegration implements ModMenuApi {
            @Override
            public ConfigScreenFactory<?> getModConfigScreenFactory() {
                return parent -> new EditorScreen();
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/pojavhud/PojavHudClient.java
        package com.pojavhud;

        import com.mojang.blaze3d.platform.InputConstants;
        import net.fabricmc.api.ClientModInitializer;
        import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
        import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
        import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
        import net.minecraft.client.KeyMapping;
        import net.minecraft.network.chat.Component;
        import net.minecraft.resources.Identifier;
        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;

        public class PojavHudClient implements ClientModInitializer {
            public static final String MOD_ID = "pojavhud";
            public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

            public static final KeyMapping.Category CATEGORY = KeyMapping.Category.register(Identifier.fromNamespaceAndPath(MOD_ID, "main"));

            public static KeyMapping toggleKey;
            public static KeyMapping editorKey;
            public static KeyMapping hideInMenusKey;

            public static boolean hudVisible = true;
            public static boolean editorOpen = false;
            public static boolean hideInMenus = false;

            public static HudConfig
