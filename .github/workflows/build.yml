        EOF
        cat << 'EOF' > src/main/java/com/pojavhud/ModMenuIntegration.java
        package com.pojavhud;
        import com.terraformersmc.modmenu.api.ConfigScreenFactory;
        import com.terraformersmc.modmenu.api.ModMenuApi;
        public class ModMenuIntegration implements ModMenuApi { @Override public ConfigScreenFactory<?> getModConfigScreenFactory() { return parent -> new EditorScreen(); } }
        EOF
        cat << 'EOF' > src/main/java/com/pojavhud/PojavHudClient.java
        package com.pojavhud;
        import com.mojang.blaze3d.platform.InputConstants;
        import net.fabricmc.api.ClientModInitializer;
        import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
        import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
        import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
        import net.minecraft.client.KeyMapping;
        import net.minecraft.network.chat.Component;
        import net.minecraft.resources.Identifier;
        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;
        public class PojavHudClient implements ClientModInitializer {
            public static final String MOD_ID = "pojavhud";
            public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);
            public static final KeyMapping.Category CATEGORY = KeyMapping.Category.register(Identifier.fromNamespaceAndPath(MOD_ID, "main"));
            public static KeyMapping toggleKey, editorKey, hideInMenusKey;
            public static boolean hudVisible = true, editorOpen = false, hideInMenus = false;
            public static HudConfig config;
            @Override public void onInitializeClient() {
                config = HudConfig.load();
                toggleKey = KeyMappingHelper.registerKeyMapping(new KeyMapping("key.pojavhud.toggle", InputConstants.KEY_N, CATEGORY));
                editorKey = KeyMappingHelper.registerKeyMapping(new KeyMapping("key.pojavhud.editor", InputConstants.KEY_O, CATEGORY));
                hideInMenusKey = KeyMappingHelper.registerKeyMapping(new KeyMapping("key.pojavhud.hidemenus", InputConstants.KEY_H, CATEGORY));
                ClientTickEvents.END_CLIENT_TICK.register(c -> {
                    while (toggleKey.consumeClick()) hudVisible = !hudVisible;
                    while (editorKey.consumeClick()) { if (c.gui.screen() == null) c.gui.setScreen(new EditorScreen()); }
                    while (hideInMenusKey.consumeClick()) {
                        hideInMenus = !hideInMenus;
                        if (c.player != null) c.gui.hud.setOverlayMessage(Component.literal("PojavHUD Hide in Menus: " + (hideInMenus ? "ON" : "OFF")), false);
                    }
                });
                HudElementRegistry.addLast(Identifier.fromNamespaceAndPath(MOD_ID, "overlay"), (g, dt) -> { if (hudVisible && !editorOpen) HudRenderer.render(g); });
            }
        }
        EOF
        cat << 'EOF' > src/main/java/com/pojavhud/HudConfig.java
        package com.pojavhud;
        import com.google.gson.Gson;
        import com.google.gson.GsonBuilder;
        import net.fabricmc.loader.api.FabricLoader;
        import java.nio.file.*;
        import java.util.*;
        public class HudConfig {
            private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
            private static final Path CONFIG_PATH = FabricLoader.getInstance().getConfigDir().resolve("pojavhud.json");
            public int activeProfile = 0;
            public List<HudProfile> profiles = new ArrayList<>();
            public IconConfig[] icons;
            public String delayMode;
            public float customDelay = 0.5f;
            public boolean showItemDecorations = true;
            public HudConfig() { profiles.add(new HudProfile("Profile 1 (Default)")); profiles.add(new HudProfile("Profile 2 (CPvP)")); profiles.add(new HudProfile("Profile 3 (Mace PvP)")); }
            public static class HudProfile {
                public String name;
                public IconConfig[] icons = new IconConfig[9];
                public String delayMode = "HIGH";
                public float customDelay = 0.5f;
                public boolean showItemDecorations = true;
                public HudProfile() { this("Profile"); }
                public HudProfile(String name) { this.name = name; for (int i = 0; i < 9; i++) { icons[i] = new IconConfig(); icons[i].x = 0.35f + i * 0.04f; } }
            }
            public static class IconConfig { public float x = 0.5f, y = 0.5f, scale = 1.0f, opacity = 1.0f; }
            public HudProfile getCurrentProfile() {
                if (profiles == null || profiles.isEmpty()) { profiles = new ArrayList<>(); profiles.add(new HudProfile("Profile 1")); }
                if (activeProfile < 0 || activeProfile >= profiles.size()) activeProfile = 0;
                HudProfile p = profiles.get(activeProfile);
                if (p.icons == null || p.icons.length != 9) p.icons = new HudProfile(p.name != null ? p.name : "Profile").icons;
                return p;
            }
            public IconConfig[] getIcons() { return getCurrentProfile().icons; }
            public void cycleProfile() { if (profiles != null && !profiles.isEmpty()) { activeProfile = (activeProfile + 1) % profiles.size(); HudRenderer.markLayoutDirty(); save(); } }
            public void addProfile() {
                if (profiles == null) profiles = new ArrayList<>();
                HudProfile np = new HudProfile("Profile " + (profiles.size() + 1));
                IconConfig[] cur = getIcons();
                for (int i = 0; i < 9; i++) if (cur[i] != null) { np.icons[i].x = cur[i].x; np.icons[i].y = cur[i].y; np.icons[i].scale = cur[i].scale; np.icons[i].opacity = cur[i].opacity; }
                profiles.add(np); activeProfile = profiles.size() - 1; HudRenderer.markLayoutDirty(); save();
            }
            public String getProfileButtonText() { return "Layout: " + (activeProfile + 1) + "/" + profiles.size(); }
            public long getDelayMs() {
                HudProfile p = getCurrentProfile();
                if (p.delayMode == null) return 300L;
                return switch (p.delayMode) { case "OFF" -> 0L; case "HIGH" -> 300L; case "MEDIUM" -> 900L; case "LOW" -> 1200L; case "CUSTOM" -> (long)(Math.max(0f, p.customDelay)*1000f); default -> 300L; };
            }
            public void cycleDelayMode() {
                HudProfile p = getCurrentProfile();
                if (p.delayMode == null) p.delayMode = "HIGH";
                p.delayMode = switch (p.delayMode) { case "OFF" -> "HIGH"; case "HIGH" -> "MEDIUM"; case "MEDIUM" -> "LOW"; case "LOW" -> "CUSTOM"; default -> "OFF"; };
                save();
            }
            public String getDelayButtonText() {
                HudProfile p = getCurrentProfile();
                if (p.delayMode == null) p.delayMode = "HIGH";
                return switch (p.delayMode) { case "OFF" -> "Opt: Off (0s)"; case "HIGH" -> "Opt: High (0.3s)"; case "MEDIUM" -> "Opt: Med (0.9s)"; case "LOW" -> "Opt: Low (1.2s)"; case "CUSTOM" -> "Opt: Custom"; default -> "Opt: High (0.3s)"; };
            }
            public static HudConfig load() {
                if (Files.exists(CONFIG_PATH)) {
                    try {
                        HudConfig c = GSON.fromJson(Files.readString(CONFIG_PATH), HudConfig.class);
                        if (c != null) {
                            if ((c.profiles == null || c.profiles.isEmpty()) && c.icons != null && c.icons.length == 9) {
                                c.profiles = new ArrayList<>();
                                HudProfile m = new HudProfile("Profile 1 (Migrated)");
                                m.icons = c.icons; m.delayMode = c.delayMode != null ? c.delayMode : "HIGH"; m.customDelay = c.customDelay >= 0f ? c.customDelay : 0.5f; m.showItemDecorations = c.showItemDecorations;
                                c.profiles.add(m); c.profiles.add(new HudProfile("Profile 2 (CPvP)")); c.profiles.add(new HudProfile("Profile 3 (Mace PvP)"));
                                c.icons = null; c.activeProfile = 0; c.save();
                            }
                            if (c.profiles != null && !c.profiles.isEmpty()) { c.getCurrentProfile(); return c; }
                        }
                    } catch (Exception e) { PojavHudClient.LOGGER.error("Failed to load config", e); }
                }
                HudConfig c = new HudConfig(); c.save(); return c;
            }
            public void save() {
                try { if (CONFIG_PATH.getParent() != null) Files.createDirectories(CONFIG_PATH.getParent()); Files.writeString(CONFIG_PATH, GSON.toJson(this)); }
                catch (Exception e) { PojavHudClient.LOGGER.error("Failed to save config", e); }
            }
            public void resetCurrentProfile() {
                HudProfile cur = getCurrentProfile(), def = new HudProfile(cur.name);
                cur.icons = def.icons; cur.delayMode = def.delayMode; cur.customDelay = def.customDelay; cur.showItemDecorations = def.showItemDecorations;
                HudRenderer.markLayoutDirty(); save();
            }
        }
        EOF
    - name: Generate Renderer, Editor & Build Jar
      run: |
        cat << 'EOF' > src/main/java/com/pojavhud/HudRenderer.java
        package com.pojavhud;
        import net.minecraft.client.Minecraft;
        import net.minecraft.client.gui.Font;
        import net.minecraft.client.gui.GuiGraphicsExtractor;
        import net.minecraft.world.entity.player.Inventory;
        import net.minecraft.world.item.*;
        public class HudRenderer {
            private static final ItemStack[] displayedStacks = new ItemStack[9];
            private static final Item[] pendingItems = new Item[9];
            private static final long[] changeTimestamps = new long[9];
            private static final int[] cachedX = new int[9], cachedY = new int[9], cachedSize = new int[9];
            private static int lastW = -1, lastH = -1;
            private static boolean layoutDirty = true;
            static { for (int i = 0; i < 9; i++) { displayedStacks[i] = ItemStack.EMPTY; pendingItems[i] = Items.AIR; } }
            public static void markLayoutDirty() { layoutDirty = true; }
            private static void updateCache(int sw, int sh, HudConfig.IconConfig[] icons) {
                for (int i = 0; i < 9; i++) { int s = (int)(16 * icons[i].scale); cachedSize[i] = s; cachedX[i] = (int)(icons[i].x * sw) - s/2; cachedY[i] = (int)(icons[i].y * sh) - s/2; }
                lastW = sw; lastH = sh; layoutDirty = false;
            }
            public static void render(GuiGraphicsExtractor g) {
                Minecraft c = Minecraft.getInstance();
                if (c == null || c.player == null || c.gui.hud.isHidden() || (PojavHudClient.hideInMenus && c.gui.screen() != null)) return;
                Inventory inv = c.player.getInventory();
                int sw = c.getWindow().getGuiScaledWidth(), sh = c.getWindow().getGuiScaledHeight();
                HudConfig.HudProfile prof = PojavHudClient.config.getCurrentProfile();
                if (layoutDirty || sw != lastW || sh != lastH) updateCache(sw, sh, prof.icons);
                long now = System.currentTimeMillis(), delay = PojavHudClient.config.getDelayMs();
                Font font = c.font;
                for (int i = 0; i < 9; i++) {
                    HudConfig.IconConfig ic = prof.icons[i];
                    if (ic == null || ic.opacity <= 0.01f) continue;
                    ItemStack cur = inv.getItem(i);
                    if (cur == null || cur.isEmpty()) { displayedStacks[i] = ItemStack.EMPTY; pendingItems[i] = Items.AIR; continue; }
                    Item item = cur.getItem();
                    if (delay <= 0L) { displayedStacks[i] = cur; pendingItems[i] = item; }
                    else {
                        if (item != pendingItems[i]) { pendingItems[i] = item; changeTimestamps[i] = now; }
                        if (now - changeTimestamps[i] >= delay || displayedStacks[i].is(item)) displayedStacks[i] = cur;
                    }
                    ItemStack tr = displayedStacks[i];
                    if (tr == null || tr.isEmpty()) continue;
                    var p = g.pose(); p.pushMatrix();
                    p.translate(cachedX[i] + cachedSize[i]/2f, cachedY[i] + cachedSize[i]/2f);
                    p.scale(ic.scale, ic.scale); p.translate(-8f, -8f);
                    g.item(tr, 0, 0);
                    if (prof.showItemDecorations && font != null) g.itemDecorations(font, tr, 0, 0);
                    p.popMatrix();
                }
            }
        }
        EOF
        cat << 'EOF' > src/main/java/com/pojavhud/EditorScreen.java
        package com.pojavhud;
        import com.mojang.blaze3d.platform.InputConstants;
        import net.minecraft.client.Minecraft;
        import net.minecraft.client.gui.GuiGraphicsExtractor;
        import net.minecraft.client.gui.components.*;
        import net.minecraft.client.gui.screens.Screen;
        import net.minecraft.client.input.MouseButtonEvent;
        import net.minecraft.network.chat.Component;
        import net.minecraft.world.entity.player.Inventory;
        import net.minecraft.world.item.ItemStack;
        public class EditorScreen extends Screen {
            private int selectedIcon = 0;
            private boolean dragging = false, resizing = false;
            private double dragOffsetX, dragOffsetY;
            private Button profileButton, optButton, countButton;
            private EditBox customDelayField;
            public EditorScreen() { super(Component.literal("PojavHUD Editor")); PojavHudClient.editorOpen = true; }
            private void refreshUi() {
                HudConfig.HudProfile p = PojavHudClient.config.getCurrentProfile();
                if (profileButton != null) profileButton.setMessage(Component.literal(PojavHudClient.config.getProfileButtonText()));
                if (optButton != null) optButton.setMessage(Component.literal(PojavHudClient.config.getDelayButtonText()));
                if (countButton != null) countButton.setMessage(Component.literal("Count: " + (p.showItemDecorations ? "ON" : "OFF")));
                if (customDelayField != null) { customDelayField.setValue(String.valueOf(p.customDelay)); customDelayField.setVisible("CUSTOM".equals(p.delayMode)); }
            }
            @Override protected void init() {
                int by = this.height - 28, ty = 10;
                profileButton = Button.builder(Component.literal(PojavHudClient.config.getProfileButtonText()), b -> { PojavHudClient.config.cycleProfile(); refreshUi(); }).bounds(this.width - 135, ty, 95, 20).build();
                this.addRenderableWidget(profileButton);
                this.addRenderableWidget(Button.builder(Component.literal("+New"), b -> { PojavHudClient.config.addProfile(); refreshUi(); }).bounds(this.width - 37, ty, 32, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Reset"), b -> { PojavHudClient.config.resetCurrentProfile(); refreshUi(); }).bounds(8, by, 42, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Save"), b -> { PojavHudClient.config.save(); this.onClose(); }).bounds(54, by, 42, 20).build());
                optButton = Button.builder(Component.literal(PojavHudClient.config.getDelayButtonText()), b -> { PojavHudClient.config.cycleDelayMode(); refreshUi(); }).bounds(100, by, 88, 20).build();
                this.addRenderableWidget(optButton);
                customDelayField = new EditBox(this.font, 192, by, 36, 20, Component.literal("Delay"));
                customDelayField.setMaxLength(6); customDelayField.setValue(String.valueOf(PojavHudClient.config.getCurrentProfile().customDelay));
                customDelayField.setVisible("CUSTOM".equals(PojavHudClient.config.getCurrentProfile().delayMode));
                customDelayField.setResponder(t -> { try { float v = Float.parseFloat(t.trim()); if (v >= 0f && v <= 60f) PojavHudClient.config.getCurrentProfile().customDelay = v; } catch (Exception ignored) {} });
                this.addRenderableWidget(customDelayField);
                countButton = Button.builder(Component.literal("Count: " + (PojavHudClient.config.getCurrentProfile().showItemDecorations ? "ON" : "OFF")), b -> {
                    HudConfig.HudProfile p = PojavHudClient.config.getCurrentProfile(); p.showItemDecorations = !p.showItemDecorations;
                    b.setMessage(Component.literal("Count: " + (p.showItemDecorations ? "ON" : "OFF"))); PojavHudClient.config.save();
                }).bounds(232, by, 72, 20).build();
                this.addRenderableWidget(countButton);
                this.addRenderableWidget(Button.builder(Component.literal("Size+"), b -> { for (var ic : PojavHudClient.config.getIcons()) if (ic != null) ic.scale = Math.min(4f, ic.scale + 0.1f); HudRenderer.markLayoutDirty(); PojavHudClient.config.save(); }).bounds(308, by, 34, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Size-"), b -> { for (var ic : PojavHudClient.config.getIcons()) if (ic != null) ic.scale = Math.max(0.5f, ic.scale - 0.1f); HudRenderer.markLayoutDirty(); PojavHudClient.config.save(); }).bounds(345, by, 34, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Op+"), b -> { for (var ic : PojavHudClient.config.getIcons()) if (ic != null) ic.opacity = Math.min(1f, ic.opacity + 0.1f); PojavHudClient.config.save(); }).bounds(383, by, 28, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Op-"), b -> { for (var ic : PojavHudClient.config.getIcons()) if (ic != null) ic.opacity = Math.max(0.1f, ic.opacity - 0.1f); PojavHudClient.config.save(); }).bounds(414, by, 28, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Prev"), b -> selectedIcon = (selectedIcon + 8) % 9).bounds(this.width - 96, by, 42, 20).build());
                this.addRenderableWidget(Button.builder(Component.literal("Next"), b -> selectedIcon = (selectedIcon + 1) % 9).bounds(this.width - 50, by, 42, 20).build());
            }
            @Override public void extractRenderState(GuiGraphicsExtractor g, int mx, int my, float d) {
                g.fill(0, 0, this.width, this.height, 0x80000000); super.extractRenderState(g, mx, my, d);
                Minecraft c = Minecraft.getInstance();
                Inventory inv = (c != null && c.player != null) ? c.player.getInventory() : null;
                HudConfig.HudProfile prof = PojavHudClient.config.getCurrentProfile();
                HudConfig.IconConfig[] icons = prof.icons;
                g.text(this.font, "Selected: Icon " + (selectedIcon + 1) + " | Active: " + prof.name, 10, 10, 0xFFFFFFFF, false);
                g.text(this.font, "Drag to move | Corner to resize | Top-right swaps control layouts", 10, 22, 0xFFAAAAAA, false);
                g.text(this.font, String.format("Pos: (%.3f, %.3f) Scale: %.2f Opacity: %.2f Delay: %.2fs", icons[selectedIcon].x, icons[selectedIcon].y, icons[selectedIcon].scale, icons[selectedIcon].opacity, PojavHudClient.config.getDelayMs()/1000f), 10, 34, 0xFFFFFFFF, false);
                for (int i = 0; i < 9; i++) {
                    HudConfig.IconConfig ic = icons[i]; if (ic == null) continue;
                    int s = Math.max(8, (int)(16 * ic.scale)), x = (int)(ic.x * this.width) - s/2, y = (int)(ic.y * this.height) - s/2;
                    g.fill(x - 2, y - 2, x + s + 2, y + s + 2, i == selectedIcon ? 0x80FFFF00 : 0x40000000);
                    ItemStack st = (inv != null) ? inv.getItem(i) : ItemStack.EMPTY;
                    if (st != null && !st.isEmpty()) {
                        var p = g.pose(); p.pushMatrix(); p.translate(x + s/2f, y + s/2f); p.scale(ic.scale, ic.scale); p.translate(-8f, -8f);
                        g.item(st, 0, 0); if (prof.showItemDecorations && c.font != null) g.itemDecorations(c.font, st, 0, 0); p.popMatrix();
                    } else g.centeredText(this.font, String.valueOf(i + 1), x + s/2, y + s/2 - 4, 0xFF888888);
                    if (i == selectedIcon) g.fill(x + s - 8, y + s - 8, x + s, y + s, 0xFFFFFFFF);
                }
            }
            @Override public boolean mouseClicked(MouseButtonEvent cl, boolean dbl) {
                if (super.mouseClicked(cl, dbl)) return true;
                if (cl.button() == 0 || cl.button() == InputConstants.MOUSE_BUTTON_LEFT) {
                    double mx = cl.x(), my = cl.y();
                    HudConfig.IconConfig[] icons = PojavHudClient.config.getIcons();
                    HudConfig.IconConfig ic = icons[selectedIcon]; if (ic == null) return false;
                    int s = Math.max(8, (int)(16 * ic.scale)), x = (int)(ic.x * this.width) - s/2, y = (int)(ic.y * this.height) - s/2;
                    if (mx >= x + s - 8 && mx <= x + s && my >= y + s - 8 && my <= y + s) { resizing = true; return true; }
                    if (mx >= x && mx <= x + s && my >= y && my <= y + s) { dragging = true; dragOffsetX = mx - ic.x * this.width; dragOffsetY = my - ic.y * this.height; return true; }
                    for (int i = 0; i < 9; i++) {
                        HudConfig.IconConfig o = icons[i]; if (o == null) continue;
                        int os = Math.max(8, (int)(16 * o.scale)), ix = (int)(o.x * this.width) - os/2, iy = (int)(o.y * this.height) - os/2;
                        if (mx >= ix && mx <= ix + os && my >= iy && my <= iy + os) { selectedIcon = i; dragging = true; dragOffsetX = mx - o.x * this.width; dragOffsetY = my - o.y * this.height; return true; }
                    }
                }
                return false;
            }
            @Override public boolean mouseReleased(MouseButtonEvent cl) {
                if (cl.button() == 0 || cl.button() == InputConstants.MOUSE_BUTTON_LEFT) { dragging = false; resizing = false; HudRenderer.markLayoutDirty(); PojavHudClient.config.save(); }
                return super.mouseReleased(cl);
            }
            @Override public boolean mouseDragged(MouseButtonEvent cl, double dx, double dy) {
                if (cl.button() == 0 || cl.button() == InputConstants.MOUSE_BUTTON_LEFT) {
                    HudConfig.IconConfig[] icons = PojavHudClient.config.getIcons();
                    HudConfig.IconConfig ic = icons[selectedIcon]; if (ic == null) return false;
                    if (dragging) {
                        float nx = Math.max(0f, Math.min(1f, (float)((cl.x() - dragOffsetX)/this.width))), ny = Math.max(0f, Math.min(1f, (float)((cl.y() - dragOffsetY)/this.height)));
                        for (int i = 0; i < 9; i++) { if (i != selectedIcon && icons[i] != null) { if (Math.abs(icons[i].y - ny) < 0.015f) ny = icons[i].y; if (Math.abs(icons[i].x - nx) < 0.015f) nx = icons[i].x; } }
                        ic.x = nx; ic.y = ny; HudRenderer.markLayoutDirty(); return true;
                    }
                    if (resizing) {
                        double dist = Math.max(Math.abs(cl.x() - ic.x * this.width), Math.abs(cl.y() - ic.y * this.height));
                        ic.scale = (float)Math.max(0.5, Math.min(4.0, dist / 8.0)); HudRenderer.markLayoutDirty(); return true;
                    }
                }
                return super.mouseDragged(cl, dx, dy);
            }
            @Override public boolean mouseScrolled(double mx, double my, double ha, double va) {
                HudConfig.IconConfig ic = PojavHudClient.config.getIcons()[selectedIcon];
                if (ic != null) ic.opacity = (float)Math.max(0.1, Math.min(1.0, ic.opacity + va * 0.05));
                return true;
            }
            @Override public void onClose() { PojavHudClient.editorOpen = false; HudRenderer.markLayoutDirty(); PojavHudClient.config.save(); super.close(); }
            @Override public boolean isPauseScreen() { return false; }
        }
