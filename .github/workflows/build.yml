name: Build PojavHUD 1.2.0 Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.6.0'

    - name: Create PojavHUD 1.2.0 Source Files for 26.3
      run: |
        mkdir -p src/main/java/com/pojavhud
        mkdir -p src/modmenuApi/java/com/terraformersmc/modmenu/api
        mkdir -p src/main/resources/assets/pojavhud/lang

        LOOM_VER=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -oP '(?<=<latest>)[^<]+' || echo "1.18-SNAPSHOT")
        LOADER_VER=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -oP '(?<=<latest>)[^<]+' || echo "0.19.5")
        FAPI_VER=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+\+26\.3(?=</version>)' | tail -n 1 || true)
        if [ -z "$FAPI_VER" ]; then
          FAPI_VER="0.163.0+26.3"
        fi
        echo "Resolved Loom=$LOOM_VER, Loader=$LOADER_VER, FabricAPI=$FAPI_VER"

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                maven {
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net/'
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        rootProject.name = 'pojavhud'
        EOF

        cat << EOF > gradle.properties
        org.gradle.jvmargs=-Xmx3G
        org.gradle.parallel=true
        org.gradle.configuration-cache=false

        minecraft_version=26.3
        loader_version=${LOADER_VER}
        loom_version=${LOOM_VER}

        version=1.2.0
        group=com.pojavhud
        archives_base_name=pojavhud-26.3

        fabric_api_version=${FAPI_VER}
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'net.fabricmc.fabric-loom' version "${loom_version}"
            id 'maven-publish'
        }

        version = project.version
        group = project.group

        base {
            archivesName = project.archives_base_name
        }

        repositories {
            maven { url = "https://maven.fabricmc.net/" }
            mavenCentral()
        }

        sourceSets {
            modmenuApi {
                compileClasspath += sourceSets.main.compileClasspath
            }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
            compileOnly sourceSets.modmenuApi.output
        }

        processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") {
                expand "version": project.version
            }
        }

        tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
        }

        java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
        }

        jar {
            from("LICENSE") {
                rename { "${it}_${project.base.archivesName.get()}" }
            }
        }
        EOF

        cat << 'EOF' > LICENSE
        MIT License

        Copyright (c) 2025 PojavHUD

        Permission is hereby granted, free of charge, to any person obtaining a copy
        of this software and associated documentation files (the "Software"), to deal
        in the Software without restriction, including without limitation the rights
        to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
        copies of the Software, and to permit persons to whom the Software is
        furnished to do so, subject to the following conditions:

        The above copyright notice and this permission notice shall be included in all
        copies or substantial portions of the Software.
        EOF

        cat << 'EOF' > src/main/resources/fabric.mod.json
        {
          "schemaVersion": 1,
          "id": "pojavhud",
          "version": "${version}",
          "name": "PojavHUD (26.3)",
          "description": "Customizable Minecraft item texture overlay for hotbar slots. For Minecraft 26.3. Designed for PojavLauncher touchscreen buttons.",
          "authors": ["PojavHUD"],
          "contact": {},
          "license": "MIT",
          "icon": "assets/pojavhud/icon.png",
          "environment": "client",
          "entrypoints": {
            "client": ["com.pojavhud.PojavHudClient"],
            "modmenu": ["com.pojavhud.ModMenuIntegration"]
          },
          "depends": {
            "fabricloader": ">=0.19.0",
            "minecraft": ">=26.3",
            "java": ">=25",
            "fabric-api": "*"
          },
          "suggests": {
            "modmenu": "*"
          }
        }
        EOF

        cat << 'EOF' > src/main/resources/assets/pojavhud/lang/en_us.json
        {
          "key.pojavhud.toggle": "Toggle PojavHUD",
          "key.pojavhud.editor": "Open PojavHUD Editor",
          "key.pojavhud.hidemenus": "Toggle PojavHUD Hide in Menus",
          "category.pojavhud": "PojavHUD",
          "key.category.pojavhud.main": "PojavHUD"
        }
        EOF

        echo "" | base64 -d > src/main/resources/assets/pojavhud/icon.png

        cat << 'EOF' > src/modmenuApi/java/com/terraformersmc/modmenu/api/ConfigScreenFactory.java
        package com.terraformersmc.modmenu.api;

        import net.minecraft.client.gui.screens.Screen;

        @FunctionalInterface
        public interface ConfigScreenFactory<S extends Screen> {
            S create(Screen parent);
        }
        EOF

        cat << 'EOF' > src/modmenuApi/java/com/terraformersmc/modmenu/api/ModMenuApi.java
        package com.terraformersmc.modmenu.api;

        public interface ModMenuApi {
            default ConfigScreenFactory<?> getModConfigScreenFactory() {
                return screen -> null;
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/pojavhud/PojavHud.java
        package com.pojavhud;

        import net.fabricmc.api.ModInitializer;

        public class PojavHud implements ModInitializer {
            @Override
            public void onInitialize() {
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/pojavhud/ModMenuIntegration.java
        package com.pojavhud;

        import com.terraformersmc.modmenu.api.ConfigScreenFactory;
        import com.terraformersmc.modmenu.api.ModMenuApi;

        public class ModMenuIntegration implements ModMenuApi {
            @Override
            public ConfigScreenFactory<?> getModConfigScreenFactory() {
                return parent -> new EditorScreen();
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/pojavhud/PojavHudClient.java
        package com.pojavhud;

        import com.mojang.blaze3d.platform.InputConstants;
        import net.fabricmc.api.ClientModInitializer;
        import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
        import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
        import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
        import net.minecraft.client.KeyMapping;
        import net.minecraft.network.chat.Component;
        import net.minecraft.resources.Identifier;
        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;

        public class PojavHudClient implements ClientModInitializer {
            public static final String MOD_ID = "pojavhud";
            public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

            public static final KeyMapping.Category CATEGORY = KeyMapping.Category.register(Identifier.fromNamespaceAndPath(MOD_ID, "main"));

            public static KeyMapping toggleKey;
            public static KeyMapping editorKey;
            public static KeyMapping hideInMenusKey;

            public static boolean hudVisible = true;
            public static boolean editorOpen = false;
            public static boolean hideInMenus = false;

            public static HudConfig config;

            @Override
            public void onInitializeClient() {
                LOGGER.info("PojavHUD 1.2.0 (26.3) initializing...");
                config = HudConfig.load();

                toggleKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                        "key.pojavhud.toggle",
                        InputConstants.KEY_N,
                        CATEGORY
                ));
                editorKey = KeyMapping
