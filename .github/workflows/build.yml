{
"name": "Build PojavHUD 1.2.0 Jar",
"on": ["push", "workflow_dispatch"],
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Create Directories",
"run": "mkdir -p src/main/java/com/pojavhud src/main/resources/assets/pojavhud/lang"
},
{
"name": "Write Gradle Files",
"run": "echo cGx1Z2luTWFuYWdlbWVudCB7CiAgICByZXBvc2l0b3JpZXMgewogICAgICAgIG1hdmVuIHsKICAgICAgICAgICAgbmFtZSA9ICdGYWJyaWMnCiAgICAgICAgICAgIHVybCA9ICdodHRwczovL21hdmVuLmZhYnJpY21jLm5ldC8nCiAgICAgICAgfQogICAgICAgIG1hdmVuQ2VudHJhbCgpCiAgICAgICAgZ3JhZGxlUGx1Z2luUG9ydGFsKCkKICAgIH0KfQo= | base64 -d > settings.gradle && echo  | base64 -d > gradle.properties && echo  | base64 -d > build.gradle"
},
{
"name": "Write Resources",
"run": "echo TUlUIExpY2Vuc2UKCkNvcHlyaWdodCAoYykgMjAyNiBQb2phdkhVRAo= | base64 -d > LICENSE && echo  | base64 -d > src/main/resources/fabric.mod.json && echo  | base64 -d > src/main/resources/assets/pojavhud/lang/en_us.json && echo  | base64 -d > src/main/resources/assets/pojavhud/icon.png"
},
{
"name": "Write Java Sources 1",
"run": "echo cGFja2FnZSBjb20ucG9qYXZodWQ7CgppbXBvcnQgbmV0LmZhYnJpY21jLmFwaS5Nb2RJbml0aWFsaXplcjsKCnB1YmxpYyBjbGFzcyBQb2phdkh1ZCBpbXBsZW1lbnRzIE1vZEluaXRpYWxpemVyIHsKICAgIEBPdmVycmlkZQogICAgcHVibGljIHZvaWQgb25Jbml0aWFsaXplKCkgewogICAgfQp9Cg== | base64 -d > src/main/java/com/pojavhud/PojavHud.java && echo  | base64 -d > src/main/java/com/pojavhud/ModMenuIntegration.java && echo  | base64 -d > src/main/java/com/pojavhud/PojavHudClient.java && sed -i s/InputCnstants/InputConstants/g src/main/java/com/pojavhud/PojavHudClient.java"
},
{
"name": "Write Java Sources 2",
"run": "echo  | base64 -d > src/main/java/com/pojavhud/HudConfig.java && sed -i s/defaults.icons0/defaults.icons;/g src/main/java/com/pojavhud/HudConfig.java && echo  | base64 -d > src/main/java/com/pojavhud/HudRenderer.java"
},
{
"name": "Write EditorScreen",
"run": "echo  | base64 -d > src/main/java/com/pojavhud/EditorScreen.java && sed -i s/bounds\)this/bounds\(this/g src/main/java/com/pojavhud/EditorScreen.java && sed -i s/fill\)x/fill\(x/g src/main/java/com/pojavhud/EditorScreen.java"
},
{
"name": "Set up JDK 25",
"uses": "actions/setup-java@v4",
"with": {
"java-version": "25",
"distribution": "temurin"
}
},
{
"name": "Setup Gradle",
"uses": "gradle/actions/setup-gradle@v4",
"with": {
"gradle-version": "9.8.1"
}
},
{
"name": "Build with Gradle",
"run": "gradle build --no-daemon --stacktrace"
},
{
"name": "Upload Build Artifact (.jar)",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "pojavhud-26.3-1.2.0-jar",
"path": "build/libs/pojavhud-26.3-1.2.0.jar"
}
}
]
}
}
}
