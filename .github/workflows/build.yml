name: Build PojavHUD 1.3.0 (26.3)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-26_3:
    name: Build 26.3
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.7.1'

    - name: Extract Source & Build 26.3 Jar
      run: |
        python3 - << 'PY'
        import base64, zlib, json, os, struct

        # Generate Custom Rowlet Shinobi Mod Logo (128x128 PNG)
        W, H = 128, 128
        BG, OUTLINE, BODY, WHITE = (212,181,152,255), (122,68,28,255), (204,165,127,255), (242,239,235,255)
        BAND_B, BAND_L, PLATE, PLATE_B = (72,84,148,255), (176,172,212,255), (178,182,108,255), (118,122,62,255)
        CHEEK, BEAK_T, BEAK_B, BOW, BOW_D = (228,126,146,255), (240,224,198,255), (216,112,54,255), (66,146,116,255), (46,108,84,255)
        px = [[BG]*W for _ in range(H)]
        def sp(x,y,c):
            if 0<=x<W and 0<=y<H: px[y][x]=c
        def el(cx,cy,rx,ry,c):
            for y in range(int(cy-ry-1),int(cy+ry+2)):
                for x in range(int(cx-rx-1),int(cx+rx+2)):
                    if ((x-cx)/rx)**2+((y-cy)/ry)**2<=1: sp(x,y,c)
        def rc(x0,y0,x1,y1,c):
            for y in range(y0,y1):
                for x in range(x0,x1): sp(x,y,c)
        for y in range(28,44):
            for x in range(88,108):
                d=(x-94)*0.6+abs(y-36)
                if d<10: sp(x,y,OUTLINE)
                if d<7: sp(x,y,BAND_B)
        el(62,72,46,42,OUTLINE); el(62,72,43,39,BODY)
        for y in range(74,112):
            for x in range(18,106):
                if ((x-62)/42)**2+((y-72)/38)**2<=1 and y>86+abs(x-62)*0.12: sp(x,y,WHITE)
        el(46,66,18,17,OUTLINE); el(74,66,18,17,OUTLINE); el(46,66,15.5,14.5,WHITE); el(74,66,15.5,14.5,WHITE)
        for y in range(38,54):
            for x in range(20,102):
                if ((x-62)/43)**2+((y-72)/39)**2<=1.02:
                    sp(x,y,OUTLINE if y in(38,39,52,53) else (BAND_L if 44<=y<=47 else BAND_B))
        rc(36,37,78,55,OUTLINE); rc(38,39,76,53,PLATE_B); rc(40,41,74,51,PLATE); rc(42,45,44,47,OUTLINE); rc(70
